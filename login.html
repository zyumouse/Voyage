<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){try{var t=localStorage.getItem("voyage-theme")||"dark";document.documentElement.classList.add(t+"-mode");if(document.body)document.body.classList.add(t+"-mode");else document.addEventListener("DOMContentLoaded",function(){document.body.classList.add(t+"-mode")});}catch(e){}})();</script>
  <script src="theme.js" defer></script>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 84px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 32px;
    }
  </style>
</head>
<body>
  <div id="shared-header"></div>
  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">Login to Your Account</h1>
      <p class="auth-subtitle">Enter your email and password to continue.</p>
      <form class="auth-form" action="login.php" method="post">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" required>

        <button type="submit">Login</button>
      </form>
      <p class="auth-footer">Don&rsquo;t have an account? <a href="signupredir.html">Sign up</a>.</p>
    </div>
  </div>
  <script src="header-loader.js" defer></script>
</body>
</html>
