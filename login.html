<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){try{var t=localStorage.getItem("voyage-theme")||"dark";document.documentElement.classList.add(t+"-mode");if(document.body)document.body.classList.add(t+"-mode");else document.addEventListener("DOMContentLoaded",function(){document.body.classList.add(t+"-mode")});}catch(e){}})();</script>
  <script src="theme.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 84px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 32px;
    }
    .admin-notice {
      margin: 20px 0 24px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(48, 57, 255, 0.08);
      border: 1px solid rgba(48, 57, 255, 0.16);
      color: #1b1f52;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .admin-notice strong {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="shared-header"></div>
  <main class="login-page-content">
    <section class="login-layout">
      <div class="login-intro">
        <span class="hero-eyebrow">Welcome back</span>
        <h1>Continue your journey with Voyage.</h1>
        <p>Log in to manage your active tickets, plan custom routes, and keep your trips in one place.</p>
        <div class="admin-notice">
          <strong>Admin Account</strong>
          Email: admin@mouse.com<br>
          Password: admin
        </div>
      </div>
      <div class="login-card">
        <h2>Login to your account</h2>
        <p class="login-card-subtitle">Enter your email and password to continue.</p>
        <form class="auth-form" action="login.php" method="post">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" required>

          <label for="password">Password</label>
          <input id="password" type="password" name="password" required>

          <button type="submit">Login</button>
        </form>
        <p class="auth-footer">Don&rsquo;t have an account? <a href="signupredir.html">Sign up</a>.</p>
      </div>
    </section>
  </main>
  <div id="shared-footer"></div>
  <script src="header-loader.js" defer></script>
  <script src="footer-loader.js" defer></script>
</body>
</html>
