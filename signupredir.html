    <div id="popupOverlay" class="popupOverlay" aria-hidden="true">
        <div class="popupBox">
            <h2 id="popupTitle"></h2>
            <p id="popupMessage"></p>
            <button id="popupAction" class="popupButton" type="button">Continue</button>
            <button id="popupClose" class="popupClose" type="button">Close</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('signupForm');
            const overlay = document.getElementById('popupOverlay');
            const popupTitle = document.getElementById('popupTitle');
            const popupMessage = document.getElementById('popupMessage');
            const popupAction = document.getElementById('popupAction');
            const popupClose = document.getElementById('popupClose');

            function showPopup(title, message, actionText, actionUrl) {
                popupTitle.textContent = title;
                popupMessage.textContent = message;
                if (actionText) {
                    popupAction.textContent = actionText;
                    popupAction.style.display = 'inline-block';
                    popupAction.onclick = function () {
                        if (actionUrl) {
                            window.location.href = actionUrl;
                        } else {
                            closePopup();
                        }
                    };
                } else {
                    popupAction.style.display = 'none';
                }
                overlay.classList.add('visible');
                overlay.setAttribute('aria-hidden', 'false');
            }

            function closePopup() {
                overlay.classList.remove('visible');
                overlay.setAttribute('aria-hidden', 'true');
            }

            popupClose.addEventListener('click', closePopup);
            overlay.addEventListener('click', function (event) {
                if (event.target === overlay) {
                    closePopup();
                }
            });

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                const formData = new FormData(form);
                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showPopup('Success!', data.message || 'Account created successfully.', 'Go to Login', 'login.html');
                        form.reset();
                    } else {
                        showPopup('Error', data.message || 'Unable to create account.');
                    }
                })
                .catch(() => {
                    showPopup('Error', 'Unable to submit the form right now. Please try again later.');
                });
            });
        });
    </script>
